    <!--
      DIRECTION CONTRACT — The Measurement Record
      seed key 151785d7 · scope direction · mode operate · assigned index 3
      lineage: green-bar fanfold and bound instrument calibration logs

      THESIS
      A board that prints its own working. Every figure is struck into a ruled
      field directly above the count it was measured over, and a knob with no
      evidence is stamped WITHHELD rather than quietly scored as a pass. It
      refuses the category default — the analytics console that shows you
      winners and hides its arithmetic.

      OWN-WORLD
      Paper, not panel. A pale fanfold ground (#F3F5EF) banded with the green
      bar (#DBE6D7) that continuous-feed stationery used to keep a reader's eye
      on one row across a wide sheet — here it does the same job on a phone.
      Hairline rules (#8E9C93) box every figure. Ink is carbon (#141D17), never
      pure black. A colour on this page is always a claim about evidence, and
      nothing decorative may borrow one.

      OWN-WORLD, AMENDED 30 Aug 2026 — the palette, after validation
      This clause read "two non-paper colours exist and both are verdicts:
      violet (#5B4B8A) for WITHHELD and a stamp red (#B3352B) for FAIL". It
      was written before any colour went through the dataviz validator, and
      the validator is the authority on colour. Three things changed and the
      contract records them rather than letting the build diverge in silence.

      · The board carries THREE verdicts, not two. Failures and withholds are
        counted separately and are never summed, so a cleared knob needs its
        own colour. Green (#2E7D4F) is PASS. Without it the department bars
        have nothing for the toys_games outage to fail against.
      · FAIL is #A8302A as text (6.13:1 on paper) and #C24236 as a chart fill
        (4.63:1). #B3352B cleared neither role at both contrasts.
      · Two marks are not verdicts and are declared as such: ochre (#B0821F)
        means "a reading exists but is bounded", which is a fourth delta
        bucket, and the five-step green ramp (--cov-1..5) encodes magnitude.
        A sequential ramp is one hue, light to dark. It is not an accent and
        nothing may borrow it either.

      The four categorical marks were validated together against this paper:
        node scripts/validate_palette.js "#5B4B8A,#C24236,#2E7D4F,#B0821F"           --mode light --surface "#F3F5EF" --pairs all
      They land the deutan pair green↔red at ΔE 6.8, inside the 6–8 band that
      is legal ONLY with secondary encoding, so every four-bucket mark on this
      board also carries a direct label and its own hatch. Remove either one
      and this palette stops being compliant.

      STORY
      The operator opens this most mornings on a phone to learn whether the
      overnight run changed anything. The record head answers that before any
      ranking does: which dates were read, how many listings, what could and
      could not be differenced. Then the shortlist, where a row's job is to
      expose its own evidence — not to recommend a product. The operator is
      still calibrating; a row that scores well on absent data has to say so on
      its face, because that is the finding, not a defect to be hidden.

      FIRST VIEWPORT
      A record head across the full width: the run date, the store it read,
      N=29,863, and the two snapshot dates it can and cannot difference.
      Beneath it the shortlist as numbered entries on alternating fanfold
      bands — product title at reading size, then a six-field ruled block where
      each knob's figure sits above its own n= in small caps. Any withheld knob
      carries the violet stamp across its whole field. The binding knob's rule
      is the only heavy line on the page.

      FORM (raises carried in from the challengers this direction beat)
      · alphabet-storm      the figure is the material — headline readings set
                            at monumental scale, the page composed around them,
                            never 14px cells inside a grid
      · tensegrity          the knob console is drawn as a load path with the
                            binding knob visibly carrying the force, not six
                            independent sliders sitting near each other
      · ticket-wallet       a withheld verdict is stamped across its field and
                            owns it, the way VOID owns a cancelled coupon —
                            never a small grey dash
      · warm-consumer-app   the phone layout is thumb-first with a persistent
                            reachable control, not a desktop table squeezed narrow

      FINISH
      Batched screenshot round at 1440, 390, and the operator's effective width
      at 80% Chrome zoom → detect.mjs → impeccable-finish-reviewer →
      impeccable-documenter writes DESIGN.md.
    -->
    <div id="root"></div>
    <noscript>
      This board re-thresholds every knob in the browser, so it needs
      JavaScript. The underlying figures are in the JSON bundle under /data.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
